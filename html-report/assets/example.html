<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorem ipsum report</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.11.6/dist/style.css">
  <style>
    .example-flow .react-flow__node { background: #f0f9ff; border-color: #7dd3fc; border-radius: 8px; color: #075985; font-weight: 600; }
    .example-flow .react-flow__handle { background: #0284c7; border-color: white; }
    .example-flow .react-flow__edge-path { stroke: #0284c7; stroke-width: 1.5; }
    .example-flow .react-flow__edge.animated .react-flow__edge-path { animation-duration: 1.2s; }
  </style>
  <!-- Use the latest compatible stable React release when adapting this example.
       Update React, React DOM, and JSX runtime pins together, then verify in a browser. -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.3.0",
        "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?external=react",
        "react-dom": "https://esm.sh/react-dom@19.3.0?external=react",
        "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react",
        "@xyflow/react": "https://esm.sh/@xyflow/react@12.11.6?external=react,react-dom"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone@8.0.5/babel.min.js"></script>
  <script>
    Babel.registerPreset("report-react", {
      presets: [[Babel.availablePresets.react, { runtime: "automatic" }]]
    });
  </script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">
  <div class="mx-auto max-w-3xl px-6 py-12 sm:py-16">
    <header class="mb-10 border-b border-slate-200 pb-8">
      <h1 class="text-3xl font-semibold tracking-tight">Lorem ipsum report</h1>
      <p class="mt-3 text-sm leading-6 text-slate-600">
        Example content. Requires internet access and JavaScript.
      </p>
    </header>
    <main id="report"></main>
  </div>
  <script type="text/babel" data-type="module" data-presets="report-react">
    import { useState } from "react";
    import { createRoot } from "react-dom/client";
    import { ReactFlow, Background, BaseEdge, getBezierPath, MarkerType } from "@xyflow/react";

    const paragraphs = [
      "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
      "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."
    ];

    const nodes = [
      { id: "foo", type: "input", position: { x: 0, y: 0 }, data: { label: "Foo" } },
      { id: "bar", position: { x: 40, y: 80 }, data: { label: "Bar" } },
      { id: "baz", type: "output", position: { x: 0, y: 160 }, data: { label: "Baz" } }
    ];
    // Animate a circle along the edge:
    // https://reactflow.dev/examples/edges/animating-edges#animating-svg-elements
    function MotionEdge(props) {
      const [path] = getBezierPath(props);
      return (
        <>
          <BaseEdge id={props.id} path={path} markerEnd={props.markerEnd} />
          <circle r="4" fill="#0284c7" stroke="white" strokeWidth="1.5" pointerEvents="none" aria-hidden="true">
            <animateMotion dur="2s" repeatCount="indefinite" path={path} />
          </circle>
        </>
      );
    }

    const edgeTypes = { motion: MotionEdge };
    const edges = [
      { id: "foo-bar", source: "foo", target: "bar", animated: true, markerEnd: { type: MarkerType.ArrowClosed, color: "#0284c7" } },
      { id: "bar-baz", source: "bar", target: "baz", type: "motion", markerEnd: { type: MarkerType.ArrowClosed, color: "#0284c7" } }
    ];

    function Report() {
      const [expanded, setExpanded] = useState(false);
      return (
        <article aria-labelledby="passage-heading">
          <h2 id="passage-heading" className="text-xl font-semibold">Sample passage</h2>
          <p lang="la" className="mt-4 text-base leading-8 text-slate-700">{paragraphs[0]}</p>
          <p
            id="additional-passage"
            lang="la"
            hidden={!expanded}
            className="mt-4 text-base leading-8 text-slate-700"
          >
            {paragraphs[1]}
          </p>
          <button
            type="button"
            aria-expanded={expanded}
            aria-controls="additional-passage"
            onClick={() => setExpanded(value => !value)}
            className="mt-6 min-h-11 rounded-md bg-sky-800 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-900 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-sky-800"
          >
            {expanded ? "Show less" : "Read more"}
          </button>
          <section aria-labelledby="flow-heading" className="mt-10">
            <h2 id="flow-heading" className="text-xl font-semibold">Example flow</h2>
            <div className="example-flow mt-4 rounded-md border border-slate-200 bg-white" style={{ width: 240, maxWidth: "100%", height: 280 }}>
              <ReactFlow
                nodes={nodes}
                edges={edges}
                edgeTypes={edgeTypes}
                proOptions={{ hideAttribution: true }}
                fitView
                maxZoom={1}
                nodesDraggable={false}
                nodesConnectable={false}
                edgesReconnectable={false}
                deleteKeyCode={null}
                zoomOnScroll={false}
                preventScrolling={false}
              >
                <Background gap={16} size={1} color="#e2e8f0" />
              </ReactFlow>
            </div>
          </section>
        </article>
      );
    }

    createRoot(document.getElementById("report")).render(<Report />);
  </script>
</body>
</html>
